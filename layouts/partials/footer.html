<footer class="site-footer">
  <div class="container">
    <div class="footer-content">
      <div class="footer-brand">
        <img src="/images/wappen.svg" alt="Haussknecht Wappen" class="footer-wappen">
        <p class="footer-tagline">{{ .Site.Params.tagline }}</p>
      </div>
      <div class="footer-contact">
        <h3>Kontakt</h3>
        <p>Haussknecht IT Consulting</p>
        <p><a href="/kontakt/">Schreiben Sie uns</a></p>
      </div>
      <div class="footer-nav">
        <h3>Navigation</h3>
        <ul>
          {{ range .Site.Menus.main }}
          <li><a href="{{ .URL }}">{{ .Name }}</a></li>
          {{ end }}
        </ul>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; {{ now.Year }} Haussknecht IT Consulting. Alle Rechte vorbehalten.</p>
      <p class="footer-legal"><a href="/impressum/">Impressum</a> · <a href="/datenschutz/">Datenschutz</a></p>
    </div>
  </div>
</footer>
<script>
document.querySelector('.nav-toggle')?.addEventListener('click', function() {
  const expanded = this.getAttribute('aria-expanded') === 'true';
  this.setAttribute('aria-expanded', !expanded);
  document.querySelector('.nav-list').classList.toggle('open');
});
</script>
